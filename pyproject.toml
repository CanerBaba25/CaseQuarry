[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "casequarry"
version = "0.8.0"
description = "Private evidence preservation, search and review for legal teams"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE*"]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26", "httpx>=0.28,<1", "typer>=0.15,<1", "rich>=13.9,<15",
  "keyring>=25.6,<26", "pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2", "Pillow>=11,<13", "beautifulsoup4>=4.13,<5",
  "cryptography>=44,<48", "psycopg[binary]>=3.2,<4", "pyotp>=2.9,<3",
  "pypdfium2>=5.14,<6", "olefile>=0.47,<0.48", "tzdata==2026.5",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
casequarry = "casequarry_cli.main:app"
cq = "casequarry_cli.main:app"

[tool.hatch.build]
ignore-vcs = true
skip-excluded-dirs = true
exclude = [
  "**/.env", "**/.env.*", "**/.data", "**/.release-artifacts", "**/.venv",
  "**/__pycache__", "**/*.py[cod]", "**/node_modules", "**/.next", "**/target",
  "**/.cache", "**/.pytest_cache", "**/.ruff_cache", "**/.mypy_cache", "**/*.egg-info",
  "**/.gitignore", "**/.dockerignore", "**/.rgignore", "**/AGENTS.md", "**/CLAUDE.md",
  "**/.graphify*", "**/graphify-out", "**/*.log",
]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["apps/api", "apps/cli"]
include = [
  "/apps/api/casequarry/*.py", "/apps/cli/casequarry_cli/*.py",
  "/migrations/env.py", "/migrations/schema_signatures.json", "/migrations/script.py.mako",
  "/migrations/versions/*.py",
]

[tool.hatch.build.targets.wheel.sources]
"apps/api" = ""
"apps/cli" = ""
"migrations" = "casequarry/migrations"

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "casequarry/alembic.ini"

[tool.hatch.build.targets.sdist]
include = [
  "/apps/api/casequarry/*.py", "/apps/cli/casequarry_cli/*.py",
  "/migrations/env.py", "/migrations/schema_signatures.json", "/migrations/script.py.mako",
  "/migrations/versions/*.py", "/alembic.ini", "/crates/evidence-core/Cargo.toml",
  "/crates/evidence-core/src/*.rs", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml",
  "/pyproject.toml", "/scripts/hatch_build.py", "/README.md", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "scripts/hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "apps/cli", "."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["graphify-out", ".venv", "node_modules", ".data", ".release-artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

