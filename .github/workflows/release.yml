name: Publish source release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/source-checks.yml

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.24'
          python-version: '3.12'
      - name: Verify tag and build source package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv sync --locked
          uv run python -c 'import os,tomllib; from pathlib import Path; version=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "Tag must match project version"'
          uv run python scripts/tasks.py release
      - name: Publish verified development preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" .release-artifacts/*-source.zip .release-artifacts/*.zip.sha256 --verify-tag --prerelease --title "CaseQuarry $RELEASE_TAG — Development preview" --notes-file RELEASE_NOTES.md
