name: Publish application release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/source-checks.yml

  server-windows:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - run: uv run python scripts/build_server.py --platform windows-x64 --output-dir .release-artifacts/server --skip-web-build
      - run: uv run python scripts/verify_server_ci.py --archive .release-artifacts/server/casequarry-server-0.3.0-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-windows-x64
          path: .release-artifacts/server/*
          if-no-files-found: error
          retention-days: 7

  server-linux:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: casequarry_package_ci
          POSTGRES_USER: casequarry_ci
          POSTGRES_PASSWORD: ephemeral-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U casequarry_ci -d casequarry_package_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CASEQUARRY_TEST_POSTGRES_URL: postgresql+psycopg://casequarry_ci:ephemeral-ci-password@127.0.0.1:5432/casequarry_package_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - run: uv run python scripts/build_server.py --platform linux-x64 --output-dir .release-artifacts/server --skip-web-build
      - run: uv run python scripts/verify_server_ci.py --archive .release-artifacts/server/casequarry-server-0.3.0-linux-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-linux-x64
          path: .release-artifacts/server/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, server-windows, server-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.24'
          python-version: '3.12'
      - name: Verify tag and build source package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv sync --locked
          uv run python -c 'import os,tomllib; from pathlib import Path; version=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "Tag must match project version"'
          uv run python scripts/tasks.py release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-desktop
          path: .release-artifacts/desktop
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: server-*
          path: .release-artifacts/server
          merge-multiple: true
      - name: Verify distribution contents and checksums
        run: uv run python scripts/verify_release.py .release-artifacts
      - name: Publish verified development preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" .release-artifacts/*-source.zip .release-artifacts/*.zip.sha256 .release-artifacts/desktop/* .release-artifacts/server/* --verify-tag --prerelease --title "CaseQuarry $RELEASE_TAG — Web and desktop preview" --notes-file RELEASE_NOTES.md
